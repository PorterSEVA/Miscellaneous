<!DOCTYPE html>
<!-- By Ion-o-koji (Porter Olsen) -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>District Council Schedule Maker v16</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --accent: #2b6cb0;
      --muted: #666;
      --pad: 12px;
      --radius: 6px;
      --base-font: 18px;
      --thick-border: 2px;
      --border-color: #000;
      --table-outline: #000;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #111;
      font-family: system-ui, Segoe UI, Roboto, Arial;
      font-size: var(--base-font);
    }

    .app {
      min-height: 100%
    }

    .page {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      padding: 12px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #siteName {
      font-size: 1.4rem;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 6px;
      background: transparent;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1rem;
    }

    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    button.ghost {
      background: transparent;
      border: 1px solid #e6edf0;
      color: var(--muted);
    }

    main {
      margin-top: 4px;
      flex: 1 1 auto;
      overflow: auto;
    }

    .center-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
      justify-items: stretch;
      padding-top: 8px;
    }

    .big-btn {
      width: 100%;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      border-radius: 10px;
      background: linear-gradient(180deg, #fff, #f7fbff);
      border: 1px solid #e6eefc;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(10, 10, 10, 0.03);
      padding: 12px;
      font-weight: 900;
    }

    .inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    table.grid {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      border: var(--thick-border) solid var(--table-outline);
      font-size: 1rem;
    }

    table.grid td,
    table.grid th {
      border: var(--thick-border) solid var(--border-color);
      padding: 6px;
      vertical-align: middle;
      background: white;
      word-break: break-word;
      text-align: center;
    }

    table.grid th {
      font-weight: 800;
      background: #f1f7ff;
    }

    .schedule-grid td,
    .schedule-grid th {
      text-align: left;
      vertical-align: top;
    }

    .schedule-grid tr:nth-child(1) td,
    .schedule-grid tr:nth-child(2) td {
      min-height: 140px;
    }

    .cell {
      width: 100%;
      height: 100%;
      min-height: 36px;
      font-size: 1rem;
      box-sizing: border-box;
      white-space: pre-wrap;
      padding: 6px;
    }

    .cell[contenteditable="true"] {
      outline: none;
    }

    .key-grid td {
      height: 68px;
      max-height: 68px;
      padding: 4px;
      font-size: 0.95rem;
    }

    .media-grid td {
      height: 60px;
      max-height: 60px;
      padding: 4px;
      font-size: 0.95rem;
    }

    .key-grid td .cell,
    .media-grid td .cell {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      padding: 6px;
      height: 100%;
      box-sizing: border-box;
    }

    .section-divider {
      border-bottom: 1px solid #000;
      margin: 16px 0;
    }

    .goals-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      padding-right: 6px;
    }

    .goals-list.dragging {
      opacity: 0.8;
    }

    .goal-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px;
      border-radius: 8px;
      background: #fbfdff;
      border: 2px solid #000;
      cursor: move;
      user-select: none;
      flex-shrink: 0;
    }

    .goal-item.dragging-item {
      opacity: 0.5;
    }

    .goal-item.drag-over {
      border-top: 3px solid #2b6cb0;
    }

    .goal-mark {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #fff;
      border: 2px solid #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .goal-mark.checked {
      background: #2b6cb0;
      color: white;
      border-color: transparent;
    }

    .goal-text {
      flex: 1;
      min-width: 100px;
      font-weight: 900;
      font-size: 1rem;
    }

    .task-text {
      flex: 1;
      min-width: 100px;
      font-weight: 900;
      font-size: 1rem;
    }

    .goal-text:empty::before,
    .task-text:empty::before,
    .goal-details li:empty::before {
      content: attr(data-placeholder);
      color: #999;
    }

    .goal-details {
      margin-top: 4px;
      background: #f0f5ff;
      padding: 6px;
      border-radius: 4px;
      overflow: visible;
    }

    .goal-details ul {
      margin: 0;
      padding: 0 0 0 16px;
    }

    .goal-details li {
      margin: 2px 0;
      font-weight: normal;
      font-size: 0.9rem;
      min-height: 18px;
    }

    .goal-details li[contenteditable="true"] {
      padding: 2px;
      background: white;
      border-radius: 3px;
      outline: 1px solid #ccc;
    }

    .goal-item-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .goal-item-footer {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-item-footer-top {
      display: flex;
      gap: 6px;
    }

    .goal-item-footer-top button {
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .goal-item-footer-bottom {
      display: flex;
    }

    .goal-item-footer-bottom button {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .district-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .district-input-wrapper label {
      font-weight: 800;
      font-size: 1rem;
    }

    .district-input-wrapper input {
      padding: 8px 12px;
      border: 2px solid #000;
      border-radius: 6px;
      font-size: 1rem;
      flex: 1;
      max-width: 300px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #exportModal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 6, 6, 0.45);
      z-index: 9999;
    }

    .modal-inner {
      width: 92%;
      max-width: 1100px;
      background: white;
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(10, 10, 10, 0.4);
    }

    .export-box {
      width: 100%;
      height: 420px;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    input[type=file] {
      display: none;
    }

    .media-controls {
      display: flex;
      gap: 8px;
    }

    .goals-section-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .goals-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .goals-section-header div:first-child {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .goals-list-container {
      flex: 1;
      overflow: auto;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      background: #fafbfc;
      min-height: 0;
    }

    .goals-tasks-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-media-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-section-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .ki-section-header div:first-child {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .ki-table-container {
      flex: 1;
      overflow: auto;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      background: #fafbfc;
      min-height: 0;
    }

    @media (min-width:900px) {}

  </style>
</head>

<body>
  <div class="app">
    <div class="page" id="mainPage">
      <header>
        <div class="title-wrap">
          <div id="siteName" contenteditable="true" aria-label="Site name">District Council</div>
        </div>
        <div class="controls">
          <button id="importBtn" class="secondary">Import HTML</button>
          <input id="fileImport" type="file" accept=".html,text/html">
          <button id="exportBtn">Export HTML</button>
          <button class="secondary" id="resetBtn">Reset</button>
        </div>
      </header>

      <main>
        <div class="center-grid" role="navigation" aria-label="Main navigation">
          <div class="big-btn" data-target="schedulePage">Schedule</div>
          <div class="big-btn" data-target="keyIndicatorsPage">Key Indicators & Media Referrals</div>
          <div class="big-btn" data-target="goalsPage">Goals & Tasks</div>
        </div>
      </main>
    </div>

    <div class="page hidden" id="schedulePage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.15rem;">Schedule</div>
        </div>
        <div class="controls">
          <button id="addScheduleRow" class="secondary">Add row</button>
          <button id="removeScheduleRow" class="secondary">Remove row</button>
          <button class="ghost" data-action="back">Back</button>
        </div>
      </header>
      <main>
        <div class="inner">
          <div class="district-input-wrapper">
            <label for="districtInput">District Name:</label>
            <input type="text" id="districtInput" placeholder="Enter your district name">
          </div>
          <table class="grid schedule-grid" id="scheduleTable" aria-label="Schedule grid">
            <tbody>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="1-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="1-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="2-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="2-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="3-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="3-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="4-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="4-2"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="page hidden" id="keyIndicatorsPage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.15rem;">Key Indicators & Media Referrals</div>
        </div>
        <div class="controls">
          <button class="ghost" data-action="back">Back</button>
        </div>
      </header>
      <main>
        <div class="inner">
          <div class="ki-media-container">
            <div class="ki-section-wrapper">
              <div class="ki-section-header">
                <div>Key Indicators</div>
                <div class="media-controls">
                  <button id="addKIrow" class="secondary">Add row</button>
                  <button id="removeKIrow" class="secondary">Remove row</button>
                </div>
              </div>
              <div class="ki-table-container">
                <table class="grid key-grid" id="keyGrid" aria-label="Key indicators grid">
                  <tbody>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-7"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="ki-section-wrapper">
              <div class="ki-section-header">
                <div>Media Referrals</div>
                <div class="media-controls">
                  <button id="addMediaRow" class="secondary">Add row</button>
                  <button id="removeMediaRow" class="secondary">Remove row</button>
                </div>
              </div>
              <div class="ki-table-container">
                <table class="grid media-grid" id="mediaGrid" aria-label="Media referrals grid">
                  <tbody>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-1-1"></div>
                      </td>

                      <td>

                      <td>

                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-3"></div>
                      </td>

                      </td>

                    <tr>

                      <td>

                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-4-3"></div>
                      </td>

                      </td>

                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="page hidden" id="goalsPage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.15rem;">Goals & Tasks</div>
        </div>
        <div class="controls"><button class="ghost" data-action="back">Back</button></div>
      </header>
      <main>
        <div class="inner">
          <div class="goals-tasks-container">
            <div class="goals-section-wrapper">
              <div class="goals-section-header">
                <div>Goals</div>
                <button id="addGoalBtn" class="secondary">Add goal</button>
              </div>
              <div class="goals-list-container">
                <div class="goals-list" id="goalsList"></div>
              </div>
            </div>

            <div class="goals-section-wrapper">
              <div class="goals-section-header">
                <div>Tasks</div>
                <button id="addTaskBtn" class="secondary">Add task</button>
              </div>
              <div class="goals-list-container">
                <div class="goals-list" id="tasksList"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="exportModal" class="hidden" aria-hidden="true">
    <div class="modal-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:900;font-size:1.05rem">Exported HTML</div>
        <div><button id="closeExport" class="ghost">Close</button></div>
      </div>
      <div style="margin-top:12px;"><textarea id="exportOutput" class="export-box" readonly></textarea></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;">
        <button id="downloadExport" class="secondary">Download HTML</button>
      </div>
    </div>
  </div>

  <script>
    const pages = {
      mainPage: document.getElementById('mainPage'),
      schedulePage: document.getElementById('schedulePage'),
      keyIndicatorsPage: document.getElementById('keyIndicatorsPage'),
      goalsPage: document.getElementById('goalsPage')
    };

    function showPage(id) {
      Object.values(pages).forEach(p => p.classList.add('hidden'));
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
      hideExportModal();
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('.big-btn').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.target)));
    document.querySelectorAll('[data-action="back"]').forEach(b => b.addEventListener('click', () => showPage('mainPage')));

    const scheduleTable = document.getElementById('scheduleTable');
    document.getElementById('addScheduleRow').addEventListener('click', () => {
      const tbody = scheduleTable.tBodies[0];
      const rows = tbody.querySelectorAll('tr').length;
      const i = rows + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><div class="cell" contenteditable="true" data-pos="${i}-1"></div></td><td><div class="cell" contenteditable="true" data-pos="${i}-2"></div></td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('removeScheduleRow').addEventListener('click', () => {
      const tbody = scheduleTable.tBodies[0];
      const rows = tbody.querySelectorAll('tr');
      if (rows.length > 1) {
        rows[rows.length - 1].remove();
      } else {
        alert('Cannot remove the last row');
      }
    });

    const keyGrid = document.getElementById('keyGrid');
    document.getElementById('addKIrow').addEventListener('click', () => {
      const tbody = keyGrid.tBodies[0];
      const rows = tbody.querySelectorAll('tr').length;
      const i = rows + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = Array.from({
        length: 7

    function attachGoalHandlers(wrapper, isTask = false) {
      const mark = wrapper.querySelector('.goal-mark');
      if (mark) {
        mark.onclick = (e) => {
          e.stopPropagation();
          toggleMark(mark);
        };
        mark.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            toggleMark(mark);
          }
        };
      }

      const addNoteBtn = wrapper.querySelector('.small-add-note');
      if (addNoteBtn && !addNoteBtn._addNoteSetup) {
        addNoteBtn._addNoteSetup = true;
        addNoteBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const detailsEl = wrapper.querySelector('.goal-details');
          const ulEl = detailsEl.querySelector('ul');
          const newLi = document.createElement('li');
          newLi.contentEditable = 'true';
          newLi.setAttribute('data-placeholder', 'Optional note');
          ulEl.appendChild(newLi);
          if (detailsEl.classList.contains('hidden')) {
            detailsEl.classList.remove('hidden');
          }
          attachRemoveNoteHandler(newLi);
          setTimeout(() => newLi.focus(), 50);
        };
      }

      const removeNoteBtn = wrapper.querySelector('.small-remove-note');
      if (removeNoteBtn && !removeNoteBtn._removeNoteSetup) {
        removeNoteBtn._removeNoteSetup = true;
        removeNoteBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const detailsEl = wrapper.querySelector('.goal-details');
          const ulEl = detailsEl.querySelector('ul');
          const items = ulEl.querySelectorAll('li');
          if (items.length > 0) {
            items[items.length - 1].remove();
          } else {
            alert('No notes to remove');
          }
        };
      }

      const removeBtn = wrapper.querySelector('.small-remove');
      if (removeBtn && !removeBtn._removeSetup) {
        removeBtn._removeSetup = true;
        removeBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (confirm('Remove this item?')) wrapper.remove();
        };
      }

      wrapper.querySelectorAll('li').forEach(li => {
        attachRemoveNoteHandler(li);
      });

      wrapper.ondragstart = (e) => {
        e.dataTransfer.effectAllowed = 'move';
        wrapper.classList.add('dragging-item');
      };

      wrapper.ondragend = (e) => {
        wrapper.classList.remove('dragging-item');
        document.querySelectorAll('.goal-item').forEach(g => g.classList.remove('drag-over'));
      };

      wrapper.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const list = wrapper.closest('.goals-list');
        if (list && list.querySelector('.dragging-item') !== wrapper) {
          wrapper.classList.add('drag-over');
        }
      };

      wrapper.ondragleave = (e) => {
        wrapper.classList.remove('drag-over');
      };

      wrapper.ondrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const list = wrapper.closest('.goals-list');
        const dragging = list.querySelector('.dragging-item');
        if (dragging && dragging !== wrapper) {
          wrapper.parentNode.insertBefore(dragging, wrapper);
        }
        wrapper.classList.remove('drag-over');
      };
    }

    function attachRemoveNoteHandler(li) {
      if (li._removeNoteHandlerSetup) return;
      li._removeNoteHandlerSetup = true;

      li.oncontextmenu = (e) => {
        e.preventDefault();
        if (confirm('Delete this note?')) {
          li.remove();
        }
      };
    }

    function toggleMark(markEl) {
      if (markEl.classList.contains('checked')) {
        markEl.classList.remove('checked');
        markEl.textContent = 'X';
      } else {
        markEl.classList.add('checked');
        markEl.textContent = '✔';
      }
    }

    function createGoalItem(text = '', mark = 'X', details = [], isTask = false) {
      const wrapper = document.createElement('div');
      wrapper.className = 'goal-item';
      wrapper.dataset.id = (isTask ? 't-' : 'g-') + Date.now();
      wrapper.draggable = true;
      const textClass = isTask ? 'task-text' : 'goal-text';
      const removeLabel = isTask ? 'Remove task' : 'Remove goal';
      const placeholder = isTask ? 'Example task — click and edit' : 'Example goal — click and edit';
      const div = document.createElement('div');
      div.className = textClass;
      div.contentEditable = 'true';
      div.setAttribute('data-placeholder', placeholder);
      if (text) {
        div.innerText = text;
      }

      const wrapper2 = document.createElement('div');
      wrapper2.className = 'goal-item-content';
      wrapper2.appendChild(div);

      const detailsDiv = document.createElement('div');
      detailsDiv.className = 'goal-details' + (details.length === 0 ? ' hidden' : '');
      const ul = document.createElement('ul');
      details.forEach(d => {
        const li = document.createElement('li');
        li.contentEditable = 'true';
        li.setAttribute('data-placeholder', 'Optional note');
        li.innerText = d;
        ul.appendChild(li);
      });
      detailsDiv.appendChild(ul);
      wrapper2.appendChild(detailsDiv);

      const footerDiv = document.createElement('div');
      footerDiv.className = 'goal-item-footer';
      const footerTop = document.createElement('div');
      footerTop.className = 'goal-item-footer-top';

      const addBtn = document.createElement('button');
      addBtn.className = 'small-add-note secondary';
      addBtn.innerText = 'Add note';
      footerTop.appendChild(addBtn);

      const removeNoteBtn = document.createElement('button');
      removeNoteBtn.className = 'small-remove-note secondary';
      removeNoteBtn.innerText = 'Remove note';
      footerTop.appendChild(removeNoteBtn);

      footerDiv.appendChild(footerTop);

      const footerBottom = document.createElement('div');
      footerBottom.className = 'goal-item-footer-bottom';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'small-remove ghost';
      removeBtn.innerText = removeLabel;
      footerBottom.appendChild(removeBtn);
      footerDiv.appendChild(footerBottom);

      wrapper2.appendChild(footerDiv);

      const mark2 = document.createElement('div');
      mark2.className = 'goal-mark' + (mark === '✔' ? ' checked' : '');
      mark2.setAttribute('role', 'button');
      mark2.setAttribute('tabindex', '0');
      mark2.innerText = mark;

      wrapper.appendChild(mark2);
      wrapper.appendChild(wrapper2);

      attachGoalHandlers(wrapper, isTask);
      return wrapper;
    }

    function getDateStamp() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = String(now.getFullYear()).slice(-2);
      return `${month}_${day}_${year}`;
    }

    const exportBtn = document.getElementById('exportBtn'),
      exportModal = document.getElementById('exportModal'),
      exportOutput = document.getElementById('exportOutput'),
      closeExport = document.getElementById('closeExport'),
      downloadExport = document.getElementById('downloadExport');

    function hideExportModal() {
      exportModal.classList.add('hidden');
      exportModal.setAttribute('aria-hidden', 'true');
    }

    function showExportModal() {
      exportModal.classList.remove('hidden');
      exportModal.setAttribute('aria-hidden', 'false');
    }

    exportBtn.addEventListener('click', () => {
      exportOutput.value = buildExportHtml();
      showExportModal();
    });

    closeExport.addEventListener('click', hideExportModal);

    downloadExport.addEventListener('click', async (e) => {
      e.preventDefault();
      const content = buildExportHtml();
      const districtName = (document.getElementById('districtInput').value || 'District').trim();
      const dateStamp = getDateStamp();
      const filename = `${districtName} District Council ${dateStamp}.html`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: 'HTML Files',
              accept: {
                'text/html': ['.html']
              }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(new Blob([content], {
            type: 'text/html'
          }));
          await writable.close();
          alert('File saved');
          hideExportModal();
          return;
        } catch (err) {
          console.warn('File Save API error', err);
        }
      }

      try {
        const blob = new Blob([content], {
          type: 'text/html'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        hideExportModal();
        return;
      } catch (err) {
        console.warn('Blob download failed', err);
      }

      try {
        const file = new File([content], filename, {
          type: 'text/html'
        });
        if (navigator.canShare && navigator.canShare({
            files: [file]
          })) {
          await navigator.share({
            files: [file],
            title: filename
          });
          hideExportModal();
          return;
        }
      } catch (err) {
        console.warn('Web Share failed', err);
      }

      const w = window.open();
      if (w) {
        w.document.open();
        w.document.write(content);
        w.document.close();
        alert('Export opened in new tab — save it from there.');
      } else {
        alert('Unable to download; copy the HTML from the export box.');
      }
    });

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildExportHtml() {
      const districtName = (document.getElementById('districtInput').value || 'District').trim();
      const fullHeading = districtName ? `${districtName} District Council` : 'District Council';
      const css = `body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:14px;background:#fff;color:#111;font-size:18px}.notice{font-weight:900;font-size:18px;text-align:center;margin-bottom:8px}.heading{font-weight:900;font-size:22px;text-align:center;margin-bottom:10px;text-decoration:underline}.divider{border-bottom:1px solid #000;margin:16px 0}.goals-section{margin-bottom:80px}.tasks-section{margin-top:80px}table{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:12px;border:2px solid #000}table td{border:2px solid #000;padding:8px;vertical-align:middle;word-break:break-word}table td.schedule{text-align:left}table td.center{text-align:center;vertical-align:middle;height:68px;overflow:hidden}.title{font-weight:900;font-size:20px;margin:8px 0}.goal{margin-bottom:4px;font-weight:900;font-size:18px}.goal-notes{margin-left:20px;margin-top:-2px;font-weight:normal;padding-top:0px;margin-bottom:12px}.goal-notes li{margin:0px 0;}.watermark{font-size:0.75rem;color:#999;margin-top:20px;text-align:center}`;

      function gatherTableRows(selector) {

      const keyRows = gatherTableRows('#keyGrid');

      const mediaRows = gatherTableRows('#mediaGrid');

      const goalsEls = Array.from(document.querySelectorAll('#goalsList .goal-item'));
      let goalsHtml = `<div class="goals-section"><div class="divider"></div><div><div class="title">Goals</div>` + goalsEls.map(g => {
        const markEl = g.querySelector('.goal-mark');

        const textEl = g.querySelector('.goal-text');
        const text = textEl ? textEl.innerText.trim() : '';
        const detailsEl = g.querySelector('.goal-details');
        let detailsHTML = '';
        if (detailsEl && !detailsEl.classList.contains('hidden') && detailsEl.innerText.trim()) {
          const items = Array.from(detailsEl.querySelectorAll('li')).map(li => {
            let liText = li.innerText.trim();
            if (liText === 'Optional note') return '';
            return `<li>${escapeHtml(liText)}</li>`;
          }).filter(i => i).join('');
          if (items) detailsHTML = `<ul class="goal-notes">${items}</ul>`;
        }
        return `<div class="goal">${escapeHtml(mark)} ${escapeHtml(text === 'Example goal — click and edit' ? '' : text)}</div>${detailsHTML}`;
      }).join('') + `</div></div>`;

      const taskEls = Array.from(document.querySelectorAll('#tasksList .goal-item'));
      let tasksHtml = `<div class="tasks-section"><div><div class="title">Tasks</div>` + taskEls.map(t => {

        const mark = markEl ? markEl.textContent : 'X';
        const textEl = t.querySelector('.task-text');
        const text = textEl ? textEl.innerText.trim() : '';
        const detailsEl = t.querySelector('.goal-details');
        let detailsHTML = '';
        if (detailsEl && !detailsEl.classList.contains('hidden') && detailsEl.innerText.trim()) {
          const items = Array.from(detailsEl.querySelectorAll('li')).map(li => {
            let liText = li.innerText.trim();
            if (liText === 'Optional note') return '';
            return `<li>${escapeHtml(liText)}</li>`;

          if (items) detailsHTML = `<ul class="goal-notes">${items}</ul>`;

    fileImport.addEventListener('change', async (e) => {

    function parseAndLoadHtml(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');

      // Extract district name from heading or title
      const heading = doc.querySelector('.heading') || doc.querySelector('title');
      if (heading && heading.textContent.trim()) {
        const headingText = heading.textContent.trim();
        // Remove the "— Export" suffix if present
        const cleanName = headingText.replace(/\s*—\s*Export\s*$/, '').trim();

        // Extract just the district part (everything before " District Council")
        const districtMatch = cleanName.match(/^(.+?)\s+District\s+Council/i);
        const districtNameOnly = districtMatch ? districtMatch[1].trim() : cleanName;

        document.getElementById('siteName').innerText = cleanName;
        document.getElementById('districtInput').value = districtNameOnly;
      }

      function tableAfterTitleText(text) {
        const el = Array.from(doc.querySelectorAll('.title')).find(t => t.textContent.trim().toLowerCase().includes(text.toLowerCase()));
        if (!el) return null;
        let sib = el.nextElementSibling;
        while (sib && sib.tagName && sib.tagName.toLowerCase() !== 'table') sib = sib.nextElementSibling;
        return sib;
      }

      let scheduleTableParsed = tableAfterTitleText('Schedule') || doc.querySelector('table');
      if (scheduleTableParsed) loadParsedTableIntoLocal(scheduleTableParsed, '#scheduleTable');

      const keyParsed = tableAfterTitleText('Key Indicators');
      if (keyParsed) loadParsedTableIntoLocal(keyParsed, '#keyGrid');

      let mediaParsed = tableAfterTitleText('Media Referrals');
      if (!mediaParsed && keyParsed) {
        let s = keyParsed.nextElementSibling;
        while (s && s.tagName && s.tagName.toLowerCase() !== 'table') s = s.nextElementSibling;
        mediaParsed = s;
      }
      if (!mediaParsed) {
        const allTables = Array.from(doc.querySelectorAll('table'));
        if (allTables.length >= 3) mediaParsed = allTables[2];
      }
      if (mediaParsed) loadParsedTableIntoLocal(mediaParsed, '#mediaGrid');

      // Parse goals with better note extraction
      const goalTitle = Array.from(doc.querySelectorAll('.title')).find(t => /goals?/i.test(t.textContent));
      let goalEls = [];
      if (goalTitle) {
        let s = goalTitle.nextElementSibling;
        while (s) {
          if (s.classList && s.classList.contains('goal')) goalEls.push(s);
          const inside = s.querySelectorAll && s.querySelectorAll('.goal');
          if (inside && inside.length) goalEls.push(...inside);
          if (s.classList && s.classList.contains('tasks-section')) break;
          s = s.nextElementSibling;
        }
      }
      if (goalEls.length === 0) {
        // Fallback: find all .goal elements before tasks section
        const allGoals = Array.from(doc.querySelectorAll('.goal'));
        goalEls = allGoals.slice(0, Math.ceil(allGoals.length / 2));
      }

      const goalsList = document.getElementById('goalsList');
      goalsList.innerHTML = '';
      if (goalEls && goalEls.length) {
        goalEls.forEach(g => {
          const text = g.textContent.replace(/^[\s✔X\u2713\u2715]+/, '').trim();
          const raw = g.textContent.trim();
          const markChar = raw[0] && (raw[0] === '✔' || raw[0] === 'X' || raw[0] === '✓') ? raw[0] : 'X';

          // Extract notes from following ul.goal-notes
          let details = [];
          let nextEl = g.nextElementSibling;
          if (nextEl && nextEl.classList && nextEl.classList.contains('goal-notes')) {
            details = Array.from(nextEl.querySelectorAll('li')).map(li => li.textContent.trim()).filter(Boolean);
          }

          const item = createGoalItem(text, markChar, details, false);
          goalsList.appendChild(item);
        });
      }
      if (goalsList.children.length === 0) {
        goalsList.appendChild(createGoalItem('', 'X', [], false));
      }

      // Parse tasks with better note extraction
      const taskTitle = Array.from(doc.querySelectorAll('.title')).find(t => /tasks?/i.test(t.textContent));
      let taskEls = [];
      if (taskTitle) {
        let s = taskTitle.nextElementSibling;
        while (s) {
          if (s.classList && s.classList.contains('goal')) taskEls.push(s);
          const inside = s.querySelectorAll && s.querySelectorAll('.goal');
          if (inside && inside.length) taskEls.push(...inside);
          s = s.nextElementSibling;
        }
      }
      if (taskEls.length === 0) {
        // Fallback: find all .goal elements after halfway point
        const allGoals = Array.from(doc.querySelectorAll('.goal'));
        taskEls = allGoals.slice(Math.ceil(allGoals.length / 2));
      }

      const tasksList = document.getElementById('tasksList');
      tasksList.innerHTML = '';
      if (taskEls && taskEls.length) {
        taskEls.forEach(t => {
          const text = t.textContent.replace(/^[\s✔X\u2713\u2715]+/, '').trim();
          const raw = t.textContent.trim();
          const markChar = raw[0] && (raw[0] === '✔' || raw[0] === 'X' || raw[0] === '✓') ? raw[0] : 'X';

          // Extract notes from following ul.goal-notes
          let details = [];
          let nextEl = t.nextElementSibling;
          if (nextEl && nextEl.classList && nextEl.classList.contains('goal-notes')) {
            details = Array.from(nextEl.querySelectorAll('li')).map(li => li.textContent.trim()).filter(Boolean);
          }

          const item = createGoalItem(text, markChar, details, true);
          tasksList.appendChild(item);
        });
      }
      if (tasksList.children.length === 0) {
        tasksList.appendChild(createGoalItem('', 'X', [], true));
      }
    }

    function loadParsedTableIntoLocal(parsedTable, localSelector) {
      const localTable = document.querySelector(localSelector);
      if (!localTable) return;
      const parsedRows = Array.from(parsedTable.querySelectorAll('tr'));
      const tbody = localTable.tBodies[0] || localTable.appendChild(document.createElement('tbody'));
      tbody.innerHTML = '';
      parsedRows.forEach((pr) => {
        const tr = document.createElement('tr');
        const cells = Array.from(pr.querySelectorAll('td, th'));
        if (cells.length === 0) {
          const txt = pr.textContent || '';
          const parts = txt.split('\t').filter(Boolean);
          if (parts.length) parts.forEach(p => tr.appendChild(tdCell(p)));
        } else {
          cells.forEach((pc) => tr.appendChild(tdCell(pc.innerText || pc.textContent || '')));
        }
        tbody.appendChild(tr);
      });

      function tdCell(text) {
        const td = document.createElement('td');
        const div = document.createElement('div');
        div.className = 'cell';
        div.contentEditable = 'true';
        div.innerText = text || '';
        td.appendChild(div);
        return td;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        const active = document.activeElement;
        if (active && active.isContentEditable) {
          e.preventDefault();
          const edits = Array.from(document.querySelectorAll('[contenteditable="true"]'));
          const idx = edits.indexOf(active);
          const next = edits[(idx + 1) % edits.length];
          if (next) next.focus();
        }
      }
    });

    (() => {
      const ENTRY = 'District Council Schedule Maker v16',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>
